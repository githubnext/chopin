<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<!-- The light-only ground (--color-ground) that sits behind the top chrome. -->
		<meta name="theme-color" content="#f4f4f1" />
		<meta name="color-scheme" content="light" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Chopin" />
		<!-- black-translucent would draw white status text over the light ground. -->
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		<title>chopin</title>
		<!-- Lets a phone opening a document paint its skeleton before the app's JavaScript runs. -->
		<script>
		(function() {
			var documentRoute =
				/^\/(documents(\/[^/]+){3}(\/children\/[^/]+)?|channels\/[0-9a-f-]{36})\/?$/i;
			if (documentRoute.test(location.pathname)) {
				document.documentElement.dataset.boot = "document";
			}
		})();
		</script>
		<!-- Hidden until the app's stylesheet (phone-skeleton.css) reveals it, never unstyled. -->
		<style>
		.boot-skeleton {
			display: none;
		}
		</style>
	</head>
	<body>
		<div id="root">
			<!-- A static copy of PhoneSkeleton (src/phone-skeleton.tsx); React replaces it on mount. -->
			<div class="boot-skeleton">
				<div class="phone-skeleton">
					<p class="sr-only" role="status">Opening document…</p>
					<div class="phone-skeleton-top">
						<span class="phone-skeleton-slot">
							<span aria-hidden="true" class="phone-skeleton-icon">
								<svg
									aria-hidden="true"
									data-nucleo-icon=""
									height="18"
									viewBox="0 0 18 18"
									width="18"
								>
									<g
										fill="none"
										stroke="currentColor"
										stroke-linecap="round"
										stroke-linejoin="round"
										stroke-width="1.5"
									>
										<rect x="3.25" y="4.75" width="9" height="11.5" rx="1.75"></rect>
										<path d="M6.25 2.25h6.5c1.105 0 2 .895 2 2v8.5"></path>
										<line x1="5.75" x2="9.75" y1="8.75" y2="8.75"></line>
										<line x1="5.75" x2="9.75" y1="11.75" y2="11.75"></line>
									</g>
								</svg>
							</span>
						</span>
					</div>
					<div aria-hidden="true" class="phone-skeleton-page">
						<span class="phone-skeleton-heading"></span>
						<span></span>
						<span></span>
						<span></span>
						<span></span>
						<span></span>
						<span></span>
					</div>
					<div aria-hidden="true" class="phone-skeleton-tabs">
						<span
							class="phone-skeleton-bar"
						><span></span><span></span><span></span><span></span></span>
						<span class="phone-skeleton-action"></span>
					</div>
				</div>
			</div>
		</div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
