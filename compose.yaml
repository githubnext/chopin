services:
  app:
    profiles: ["app"]
    build:
      context: .
    environment:
      AGENT: ${AGENT:-on}
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:8787}
      DATABASE_URL: postgresql://chopin:chopin@db:5432/chopin?sslmode=disable
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      MODEL: ${MODEL:-claude-sonnet-4.6}
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY:-}
      STORAGE_DRIVER: postgres
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8787:8787"
    restart: unless-stopped
    stop_grace_period: 15s

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chopin
      POSTGRES_USER: chopin
      POSTGRES_PASSWORD: chopin
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chopin -d chopin"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data

  db-e2e:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chopin
      POSTGRES_USER: chopin
      POSTGRES_PASSWORD: chopin
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chopin -d chopin"]
      interval: 2s
      timeout: 3s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data

  db-e2e-fixtures:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chopin
      POSTGRES_USER: chopin
      POSTGRES_PASSWORD: chopin
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chopin -d chopin"]
      interval: 2s
      timeout: 3s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  postgres-data:
