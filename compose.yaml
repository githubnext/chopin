services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chopin
      POSTGRES_USER: chopin
      POSTGRES_PASSWORD: chopin
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chopin -d chopin"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data

  db-e2e:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chopin
      POSTGRES_USER: chopin
      POSTGRES_PASSWORD: chopin
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chopin -d chopin"]
      interval: 2s
      timeout: 3s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data

  db-e2e-fixtures:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chopin
      POSTGRES_USER: chopin
      POSTGRES_PASSWORD: chopin
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chopin -d chopin"]
      interval: 2s
      timeout: 3s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  postgres-data:
